<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tracker Keuangan</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#eef1f4;--sf:#fff;--ink:#14202b;--mu:#5f6d7a;--ac:#0f766e;--ln:#d6dce2;--rd:#b42318;--gn:#15803d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171d;--sf:#18222b;--ink:#eaf0f5;--mu:#97a5b1;--ac:#2dd4bf;--ln:#2b3844;--rd:#f87171;--gn:#4ade80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10171d;--sf:#18222b;--ink:#eaf0f5;--mu:#97a5b1;--ac:#2dd4bf;--ln:#2b3844;--rd:#f87171;--gn:#4ade80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif}
.w{max-width:540px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:17px;margin:0 0 12px;font-weight:600}
h2{font-size:14px;margin:0 0 8px;font-weight:600;color:var(--mu)}
.total{font-size:34px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
section{padding:16px 0;border-top:1px solid var(--ln)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wal{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-top:10px}
.wal div{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:9px;font-size:12px;color:var(--mu)}
.wal b{display:block;font-size:14px;color:var(--ink)}
.bar{height:7px;background:var(--ln);border-radius:6px;overflow:hidden;margin:4px 0 9px}
.bar i{display:block;height:100%;background:var(--ac)}
.bar i.ov{background:var(--rd)}
.tabs{display:flex;gap:5px;margin-bottom:10px}
.tabs button{flex:1;padding:9px 0;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:10px;font:inherit;font-size:12.5px}
.tabs button.on{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:600}
input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--ink);font:inherit;margin-bottom:8px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.go{width:100%;padding:13px;border:0;border-radius:10px;background:var(--ac);color:var(--bg);font:inherit;font-weight:600}
.sec{width:100%;padding:11px;border:1px solid var(--ln);border-radius:10px;background:none;color:var(--ink);font:inherit;margin-top:8px}
.hint{font-size:12.5px;color:var(--mu);margin:0 0 8px}
.tx{padding:9px 0;border-top:1px solid var(--ln)}
.tx small{color:var(--mu);display:block}
.in{color:var(--gn)}.out{color:var(--rd)}.iv{color:var(--ac)}
.x{background:none;border:0;color:var(--mu);font-size:18px;padding:4px 8px}
label{font-size:12.5px;color:var(--mu);display:block;margin-bottom:2px}
summary{font-weight:600;color:var(--mu);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{padding:7px 12px;border:1px solid var(--ln);border-radius:20px;background:var(--sf);color:var(--ink);font:inherit;font-size:13px}
.chip.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th,.tb td{padding:8px 6px;text-align:left;border-top:1px solid var(--ln);vertical-align:top}
.tb th{color:var(--mu);font-weight:600}
.tb .r{text-align:right;white-space:nowrap}
.tb tbody tr{cursor:pointer}
.tb small{display:block;color:var(--mu)}
.tb tfoot td{font-weight:700}
#md{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;align-items:flex-end;justify-content:center}
#md.on{display:flex}
.sh{background:var(--bg);width:100%;max-width:540px;max-height:88vh;overflow:auto;box-sizing:border-box;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px));border-radius:16px 16px 0 0}
</style>
</head>
<body>
<div class="w">
<h1 id="ttl" onclick="editT()" style="cursor:pointer"></h1>
<div class="total" id="tot"></div>
<div class="hint" style="margin:2px 0 0">Total kekayaan: kas ditambah nilai investasi</div>
<div class="wal" id="sum"></div>
<div class="wal" id="wal"></div>
<p class="hint" style="margin:8px 0 0">Ketuk judul, dompet, kategori, aset, atau baris tabel untuk mengubah langsung.</p>

<section>
<h2>Catat</h2>
<div class="tabs" id="tabs">
<button data-t="out" class="on">Keluar</button><button data-t="in">Masuk</button><button data-t="oj">Ojol</button><button data-t="inv">Investasi</button><button data-t="tf">Pindah</button>
</div>
<div id="form"></div>
</section>

<section>
<div class="row" style="margin-bottom:4px"><h2 style="margin:0">Tabel transaksi</h2><div><button class="x" onclick="mv(-1)" aria-label="Bulan sebelumnya">‹</button><b id="ml2"></b><button class="x" onclick="mv(1)" aria-label="Bulan berikutnya">›</button></div></div>
<div id="flt"></div><p class="hint">Ketuk baris untuk mengubah atau menghapus.</p>
<div id="his"></div>
</section>

<section>
<h2>Portofolio investasi</h2>
<div id="pf"></div>
</section>

<section>
<div class="row" style="margin-bottom:8px"><h2 style="margin:0">Laporan bulanan</h2><div><button class="x" onclick="mv(-1)" aria-label="Bulan sebelumnya">‹</button><b id="ml"></b><button class="x" onclick="mv(1)" aria-label="Bulan berikutnya">›</button></div></div>
<div id="mo"></div>
</section>

<section>
<details>
<summary>Pengaturan dan cadangan</summary>
<div id="set" style="margin-top:12px"></div>
</details>
</section>
</div>

<div id="md"><div class="sh"><h2 id="mt"></h2><div id="mf"></div><button class="go" id="ms">Simpan</button><button class="sec" id="mx">Batal</button><button class="sec" id="mdl" style="color:var(--rd)">Hapus</button></div></div>

<script>
var K = "tracker-dimaz-v2", K1 = "tracker-dimaz-v1";
var CO = ["Makan", "Vape", "Bensin", "Jajan", "Kuliah", "Kuota", "Biaya admin", "Lainnya"];
var CI = ["Kiriman ortu", "Ojol", "Lainnya"];
var KJ = ["Kripto", "Saham", "Reksa", "Lainnya"];
var BL = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
var S = {w: [{id: "shopeepay", n: "ShopeePay", i: 0}, {id: "bri", n: "BRI", i: 0}, {id: "tunai", n: "Tunai", i: 0}], tx: [], px: {}, bud: {}, co: CO.slice(), ci: CI.slice(), ot: 0, sv: 0, ph: 1, kj: KJ.slice(), ttl: "Tracker Keuangan", ac: "", th: "auto", hw: "", jn: "Biaya hidup", lw: "", a1: {lib: 70, jajan: 30}, a2: {btc: 40, saham: 30, jajan: 30}};
try {
  var r = localStorage.getItem(K);
  if (r) S = Object.assign(S, JSON.parse(r));
  else {
    var o = localStorage.getItem(K1);
    if (o) {
      o = JSON.parse(o);
      S.w.forEach(function (x) { if (o.init && o.init[x.id] != null) x.i = o.init[x.id]; });
      S.tx = o.tx || [];
      S.bud = o.bud || S.bud;
    }
  }
} catch (e) {}
function save() {
  S._at = Date.now();
  try { localStorage.setItem(K, JSON.stringify(S)); } catch (e) {}
}
function $(id) { return document.getElementById(id); }
function rp(n) { return (n < 0 ? "-" : "") + "Rp" + Math.abs(Math.round(n)).toLocaleString("id-ID"); }
function fu(n) { return (+n).toLocaleString("id-ID", {maximumFractionDigits: 8}); }
function today() { return new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return {"&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;"}[c]; }); }
function wn(id) { var f = S.w.filter(function (x) { return x.id === id; })[0]; return f ? f.n : id; }
function cell(l, v, c) { return "<div>" + l + "<b class=\"" + (c || "") + "\">" + v + "</b></div>"; }
var tab = "out", M = today().slice(0, 7), FL = "all", FW = "";
function theme() {
  var e = document.documentElement;
  if (S.th === "light" || S.th === "dark") e.setAttribute("data-theme", S.th); else e.removeAttribute("data-theme");
  if (S.ac) e.style.setProperty("--ac", S.ac); else e.style.removeProperty("--ac");
  $("ttl").textContent = S.ttl + " ✎"; document.title = S.ttl;
}
function setTh(v) { S.th = v; save(); theme(); }
function setAc(v) { S.ac = v; save(); theme(); }
function setFl(v) { FL = v; render(); }

function bal() {
  var b = {};
  S.w.forEach(function (x) { b[x.id] = x.i; });
  S.tx.forEach(function (t) {
    if (!(t.w in b)) return;
    if (t.type === "in") b[t.w] += t.a;
    else if (t.type === "out") b[t.w] -= t.a;
    else if (t.type === "tf") { b[t.w] -= t.a; if (t.to in b) b[t.to] += t.a; }
    else b[t.w] += t.side === "b" ? -(t.a + t.fee) : t.a - t.fee;
  });
  return b;
}

function pf() {
  var h = {};
  S.tx.slice().sort(function (a, b) { return a.d < b.d ? -1 : a.d > b.d ? 1 : a.id - b.id; }).forEach(function (t) {
    if (t.type !== "inv") return;
    var x = h[t.asset] = h[t.asset] || {u: 0, c: 0, r: 0, k: t.k, l: t.px};
    x.l = t.px; x.k = t.k;
    if (t.side === "b") { x.u += t.u; x.c += t.a + t.fee; }
    else {
      var av = x.u ? x.c / x.u : 0;
      x.r += t.a - t.fee - av * t.u;
      x.c -= av * t.u; x.u -= t.u;
      if (x.u < 1e-9) { x.u = 0; x.c = 0; }
    }
  });
  return h;
}

function chk(w, a) { return bal()[w] >= a || confirm("Saldo " + wn(w) + " tidak cukup. Tetap catat?"); }

function form() {
  var wo = S.w.map(function (x) { return "<option value=\"" + x.id + "\">" + esc(x.n) + "</option>"; }).join("");
  var dt = "<input id=\"d\" type=\"date\" value=\"" + today() + "\" aria-label=\"Tanggal\">";
  var amt = function (p) { return "<input id=\"a\" type=\"number\" inputmode=\"decimal\" placeholder=\"" + p + "\">"; };
  var nt = "<input id=\"n\" placeholder=\"Catatan (opsional)\">";
  var ad = "<input id=\"ad\" type=\"number\" inputmode=\"numeric\" placeholder=\"Biaya admin atau pajak (opsional)\">";
  var l = function (a) { return a.map(function (c) { return "<option>" + c + "</option>"; }).join(""); };
  var h = "";
  if (tab === "out") h = "<select id=\"w\">" + wo + "</select><select id=\"c\">" + l(S.co) + "</select>" + amt("Jumlah (Rp)") + nt + ad + dt;
  if (tab === "in") h = "<select id=\"w\">" + wo + "</select><select id=\"c\">" + l(S.ci) + "</select>" + amt("Jumlah (Rp)") + nt + ad + dt;
  if (tab === "oj") h = "<select id=\"w\">" + wo + "</select>" + amt("Pendapatan ojol (Rp)") + "<input id=\"b\" type=\"number\" inputmode=\"numeric\" placeholder=\"Bensin hari itu (Rp)\">" + ad + dt;
  if (tab === "tf") h = "<label>Dari</label><select id=\"w\">" + wo + "</select><label>Ke</label><select id=\"t\">" + wo + "</select>" + amt("Jumlah (Rp)") + ad + dt;
  if (tab === "inv") h = "<select id=\"sd\"><option value=\"b\">Beli</option><option value=\"s\">Jual</option></select><select id=\"w\">" + wo + "</select><input id=\"as\" list=\"al\" placeholder=\"Aset (Bitcoin, BBCA, BMRI, ...)\"><datalist id=\"al\"><option>Bitcoin</option><option>BBCA</option><option>BMRI</option></datalist><select id=\"kj\">" + l(S.kj) + "</select>" + amt("Total nilai transaksi (Rp)") + "<input id=\"px\" type=\"number\" inputmode=\"decimal\" placeholder=\"Harga per unit (Rp)\"><p class=\"hint\" id=\"pv\">Bitcoin: uang yang dibelikan dan harga 1 BTC. Saham: harga per lembar, total = lot x 100 x harga.</p><input id=\"fe\" type=\"number\" inputmode=\"numeric\" placeholder=\"Biaya atau fee (opsional)\">" + nt + dt;
  $("form").innerHTML = h + "<button class=\"go\" id=\"ok\">Simpan</button>";
  if ($("t")) $("t").selectedIndex = Math.min(1, S.w.length - 1);
  $("ok").onclick = add;
  if (tab === "inv") {
    var pv = function () { var a = +$("a").value, p = +$("px").value; if (a > 0 && p > 0) $("pv").textContent = "Setara " + fu(a / p) + " unit"; };
    $("a").oninput = pv; $("px").oninput = pv;
    $("as").oninput = function () {
      var v = this.value.trim(), x = pf()[v];
      if (x) $("kj").value = x.k;
      else if (/btc|bitcoin|eth/i.test(v)) $("kj").value = "Kripto";
    };
  }
}

function add() {
  var a = +$("a").value;
  if (!(a > 0)) { alert("Isi jumlah dulu."); return; }
  var w = $("w").value, d = $("d").value || today(), id = Date.now(), n = $("n") ? $("n").value : "";
  if (tab === "out") { if (!chk(w, a)) return; S.tx.push({id: id, d: d, type: "out", w: w, c: $("c").value, a: a, n: n}); }
  else if (tab === "in") S.tx.push({id: id, d: d, type: "in", w: w, c: $("c").value, a: a, n: n});
  else if (tab === "oj") {
    var b = Math.max(0, +$("b").value || 0);
    S.tx.push({id: id, d: d, type: "in", w: w, c: "Ojol", a: a, n: ""});
    if (b > 0) S.tx.push({id: id + 1, d: d, type: "out", w: w, c: "Bensin", a: b, n: "Bensin ojol", oj: 1});
  } else if (tab === "tf") {
    var t = $("t").value;
    if (t === w) { alert("Dompet asal dan tujuan tidak boleh sama."); return; }
    if (!chk(w, a)) return;
    S.tx.push({id: id, d: d, type: "tf", w: w, to: t, a: a, n: ""});
  } else {
    var as = $("as").value.trim(), px = +$("px").value, fe = Math.max(0, +$("fe").value || 0), sd = $("sd").value;
    if (!as || !(px > 0)) { alert("Isi nama aset dan harga per unit."); return; }
    var u = a / px;
    if (sd === "s") {
      var hh = pf()[as];
      if (!hh || hh.u < u - 1e-9) { alert("Unit yang dijual melebihi yang kamu punya."); return; }
    } else if (!chk(w, a + fe)) return;
    S.tx.push({id: id, d: d, type: "inv", w: w, side: sd, asset: as, k: $("kj").value, a: a, u: u, px: px, fee: fe, n: n});
  }
  var fee = $("ad") ? Math.max(0, +$("ad").value || 0) : 0;
  if (fee > 0) S.tx.push({id: id + 2, d: d, type: "out", w: w, c: "Biaya admin", a: fee, n: "Biaya admin", ad: 1});
  save(); render(); form();
}

function del(id) {
  if (!confirm("Hapus transaksi ini?")) return;
  S.tx = S.tx.filter(function (t) { return t.id !== id; });
  save(); render();
}
function setPx(el) {
  var v = +el.value;
  if (v > 0) S.px[el.dataset.a] = v; else delete S.px[el.dataset.a];
  save(); render();
}
function mv(d) {
  var p = M.split("-"), dt = new Date(+p[0], +p[1] - 1 + d, 1);
  M = dt.getFullYear() + "-" + ("0" + (dt.getMonth() + 1)).slice(-2);
  render();
}

function render() {
  var b = bal(), h = pf(), kas = 0, iv = 0, cost = 0, real = 0, al = {};
  S.w.forEach(function (x) { kas += b[x.id]; });
  Object.keys(h).forEach(function (a) {
    var x = h[a];
    real += x.r;
    if (x.u > 0) { var v = x.u * (S.px[a] || x.l); iv += v; cost += x.c; al[x.k] = (al[x.k] || 0) + v; }
  });
  var tot = kas + iv, un = iv - cost;
  $("tot").textContent = rp(tot);
  $("sum").innerHTML = cell("Kas", rp(kas)) + cell("Investasi", rp(iv)) + cell("Untung atau rugi", (un >= 0 ? "+" : "") + rp(un), un >= 0 ? "in" : "out");
  $("wal").innerHTML = S.w.map(function (x) { return "<div role=\"button\" tabindex=\"0\" style=\"cursor:pointer\" onclick=\"editW('" + x.id + "')\">" + esc(x.n) + "<b>" + rp(b[x.id]) + "</b></div>"; }).join("") + "<div role=\"button\" tabindex=\"0\" style=\"cursor:pointer;border-style:dashed;display:flex;align-items:center;justify-content:center\" onclick=\"editW()\">+ Dompet</div>";

  var ph = "";
  Object.keys(h).forEach(function (a) {
    var x = h[a];
    if (x.u <= 0) return;
    var p = S.px[a] || x.l, v = x.u * p, pl = v - x.c, pc = x.c ? pl / x.c * 100 : 0, s = pl >= 0 ? "+" : "";
    ph += "<div class=\"tx\"><div class=\"row\" style=\"cursor:pointer\" data-a=\"" + esc(a) + "\" onclick=\"editA(this.dataset.a)\"><b>" + esc(a) + " ✎</b><b class=\"" + (pl >= 0 ? "in" : "out") + "\">" + s + rp(pl) + " (" + s + pc.toFixed(1) + "%)</b></div><small>" + x.k + ", " + fu(x.u) + " unit, rata-rata " + rp(x.c / x.u) + "</small><small>Modal " + rp(x.c) + ", nilai sekarang " + rp(v) + "</small><input type=\"number\" inputmode=\"decimal\" data-a=\"" + esc(a) + "\" value=\"" + (S.px[a] || "") + "\" placeholder=\"Harga sekarang per unit (terakhir " + rp(x.l) + ")\" onchange=\"setPx(this)\" style=\"margin:6px 0 0\"></div>";
  });
  if (iv > 0) {
    var parts = [["Kas", Math.max(0, kas)]].concat(Object.keys(al).map(function (k) { return [k, al[k]]; }));
    var sm = parts.reduce(function (z, q) { return z + q[1]; }, 0) || 1;
    ph += "<h2 style=\"margin-top:16px\">Alokasi aset</h2>" + parts.map(function (q) {
      var p = q[1] / sm * 100;
      return "<div class=\"row\"><span>" + q[0] + "</span><span>" + p.toFixed(0) + "%</span></div><div class=\"bar\"><i style=\"width:" + p + "%\"></i></div>";
    }).join("");
  }
  if (Math.abs(real) > 0.5) ph += "<p class=\"hint\">Untung atau rugi yang sudah terealisasi (dari penjualan): <b class=\"" + (real >= 0 ? "in" : "out") + "\">" + (real >= 0 ? "+" : "") + rp(real) + "</b></p>";
  $("pf").innerHTML = ph || "<p class=\"hint\">Belum ada investasi. Catat pembelian lewat tab Investasi, lalu isi harga sekarang di sini untuk melihat untung atau rugi.</p>";

  var mi = 0, mo = 0, sp = {}, ok = 0, od = {}, ob = 0;
  S.tx.forEach(function (t) {
    if (t.d.slice(0, 7) !== M) return;
    if (t.type === "in") { mi += t.a; if (t.c === "Ojol") { ok += t.a; od[t.d] = 1; } }
    if (t.type === "out") { mo += t.a; sp[t.c] = (sp[t.c] || 0) + t.a; if (t.oj) ob += t.a; }
  });
  $("ml").textContent = BL[+M.slice(5) - 1] + " " + M.slice(0, 4);
  $("ml2").textContent = $("ml").textContent;
  var cats = S.co.slice();
  Object.keys(sp).forEach(function (c) { if (cats.indexOf(c) < 0) cats.push(c); });
  cats = cats.sort(function (x, y) { return (sp[y] || 0) - (sp[x] || 0); });
  var mh = "<div class=\"row\"><span>Masuk <b class=\"in\">" + rp(mi) + "</b></span><span>Keluar <b class=\"out\">" + rp(mo) + "</b></span></div><p class=\"hint\" style=\"margin-top:4px\">Selisih bulan ini " + rp(mi - mo) + ". Pembelian dan penjualan investasi tidak dihitung sebagai pemasukan atau pengeluaran.</p>";
  mh += cats.map(function (c) {
    var u = sp[c] || 0, lm = S.bud[c] || 0, p = lm ? Math.min(100, u / lm * 100) : 0;
    return "<div class=\"row\" style=\"cursor:pointer\" data-c=\"" + esc(c) + "\" onclick=\"editC('co', this.dataset.c)\"><span>" + esc(c) + "</span><span>" + rp(u) + (lm ? " dari " + rp(lm) : "") + "</span></div>" + (lm ? "<div class=\"bar\"><i class=\"" + (u > lm ? "ov" : "") + "\" style=\"width:" + p + "%\"></i></div>" : "<div style=\"height:8px\"></div>");
  }).join("");
  var nd = Object.keys(od).length;
  if (ok > 0 || S.ot > 0) {
    var sv = (S.sv || 0) * nd, nt = ok - ob - sv, ib = {Kripto: 0, Saham: 0}, lb = 0, hb = 0;
    S.tx.forEach(function (t) {
      if (t.d.slice(0, 7) !== M) return;
      if (t.type === "inv" && t.side === "b" && ib[t.k] != null) ib[t.k] += t.a;
      if (t.type === "tf" && S.lw && t.to === S.lw) lb += t.a;
      if (t.type === "tf" && S.hw && t.to === S.hw) hb += t.a;
    });
    mh += "<h2 style=\"margin-top:14px;cursor:pointer\" onclick=\"editO()\">Ojol bulan ini (fase " + S.ph + ") ✎</h2><div class=\"row\"><span>Bersih</span><span>" + rp(nt) + (S.ot > 0 ? " dari target " + rp(S.ot) : "") + "</span></div>";
    if (S.ot > 0) mh += "<div class=\"bar\"><i style=\"width:" + Math.min(100, Math.max(0, nt) / S.ot * 100) + "%\"></i></div>";
    mh += "<p class=\"hint\">Kotor " + rp(ok) + ", bensin " + rp(ob) + (sv ? ", dana servis " + rp(sv) : "") + ", " + nd + " hari ngojol" + (nd ? ", rata-rata " + rp(nt / nd) + " per hari" : "") + ".</p>";
    if (nt > 0) {
      var jn = S.jn || "Biaya hidup", jj = S.hw ? hb : null;
      var pl = S.ph === 2 ? [["Bitcoin", S.a2.btc, ib.Kripto], ["Saham", S.a2.saham, ib.Saham], [jn, S.a2.jajan, jj]] : [["Liburan", S.a1.lib, S.lw ? lb : null], [jn, S.a1.jajan, jj]];
      var tp = 0;
      pl.forEach(function (q) {
        var j = nt * q[1] / 100;
        tp += q[1];
        mh += "<div class=\"row\"><span>Jatah " + q[0] + " (" + q[1] + "%)</span><b>" + rp(j) + "</b></div><p class=\"hint\" style=\"margin:0 0 8px\">" + (q[2] == null ? "Pilih dompet tujuan di Atur pembagian hasil ojol untuk melihat progres (catat lewat tab Pindah)." : "Sudah " + rp(q[2]) + ", " + (q[2] > j ? "melebihi jatah" : "sisa " + rp(j - q[2]))) + "</p>";
      });
      if (tp < 100) mh += "<div class=\"row\"><span>Sisa (" + (100 - tp) + "%)</span><b>" + rp(nt * (100 - tp) / 100) + "</b></div>";
    }
  }
  $("mo").innerHTML = mh;

  var items = S.tx.filter(function (t) { return t.d.slice(0, 7) === M && (FL === "all" || t.type === FL) && (!FW || t.w === FW || t.to === FW); }).sort(function (a, c) { return a.d < c.d ? 1 : a.d > c.d ? -1 : c.id - a.id; });
  var th = "<div style=\"overflow-x:auto\"><table class=\"tb\"><thead><tr><th>Tgl</th><th>Keterangan</th><th>Dompet</th><th class=\"r\">Masuk</th><th class=\"r\">Keluar</th></tr></thead><tbody>";
  items.forEach(function (t) {
    var k, dm = esc(wn(t.w)), a1 = "", a2 = "", sub = t.n ? esc(t.n) : "";
    if (t.type === "in") { k = esc(t.c); a1 = rp(t.a); }
    else if (t.type === "out") { k = esc(t.c); a2 = rp(t.a); }
    else if (t.type === "tf") { k = "Pindah"; dm = esc(wn(t.w)) + " ke " + esc(wn(t.to)); sub = rp(t.a) + (sub ? ", " + sub : ""); }
    else { k = (t.side === "b" ? "Beli " : "Jual ") + esc(t.asset); sub = rp(t.a) + ", " + fu(t.u) + " unit" + (t.fee ? ", fee " + rp(t.fee) : "") + (sub ? ", " + sub : ""); }
    th += "<tr onclick=\"editTx(" + t.id + ")\"><td>" + t.d.slice(8) + "/" + t.d.slice(5, 7) + "</td><td>" + k + (sub ? "<small>" + sub + "</small>" : "") + "</td><td>" + dm + "</td><td class=\"r in\">" + a1 + "</td><td class=\"r out\">" + a2 + "</td></tr>";
  });
  th += "</tbody><tfoot><tr><td colspan=\"3\">Total</td><td class=\"r in\">" + rp(mi) + "</td><td class=\"r out\">" + rp(mo) + "</td></tr></tfoot></table></div>";
  var fi = 0, fo = 0; items.forEach(function (t) { if (t.type === "in") fi += t.a; if (t.type === "out") fo += t.a; });
  th = th.replace(rp(mi) + "</td><td class=\"r out\">" + rp(mo), rp(fi) + "</td><td class=\"r out\">" + rp(fo));
  $("flt").innerHTML = [["all", "Semua"], ["in", "Masuk"], ["out", "Keluar"], ["tf", "Pindah"], ["inv", "Investasi"]].map(function (q) { return "<button class=\"chip" + (FL === q[0] ? " on" : "") + "\" onclick=\"setFl('" + q[0] + "')\">" + q[1] + "</button>"; }).join("") + "<select style=\"margin:8px 0 10px\" onchange=\"FW=this.value;render()\"><option value=\"\">Semua dompet</option>" + S.w.map(function (x) { return "<option value=\"" + x.id + "\"" + (FW === x.id ? " selected" : "") + ">" + esc(x.n) + "</option>"; }).join("") + "</select>";
  $("his").innerHTML = items.length ? th : "<p class=\"hint\">Tidak ada transaksi untuk filter ini.</p>";
}

function sheet(title, fields, onSave, onDel) {
  $("mt").textContent = title;
  $("mf").innerHTML = fields.map(function (f) {
    var c;
    if (f.t === "select") c = "<select id=\"f_" + f.k + "\">" + f.o.map(function (o) { return "<option value=\"" + esc(o[0]) + "\"" + (String(o[0]) === String(f.v) ? " selected" : "") + ">" + esc(o[1]) + "</option>"; }).join("") + "</select>";
    else c = "<input id=\"f_" + f.k + "\" type=\"" + (f.t || "text") + "\"" + (f.t === "number" ? " inputmode=\"decimal\"" : "") + " value=\"" + esc(f.v) + "\">";
    return "<label>" + f.l + "</label>" + c;
  }).join("");
  var close = function () { $("md").classList.remove("on"); };
  var done = function () { close(); save(); render(); settings(); form(); };
  $("md").classList.add("on");
  $("mx").onclick = close;
  $("ms").onclick = function () {
    var v = {};
    fields.forEach(function (f) { v[f.k] = $("f_" + f.k).value; });
    if (onSave(v) !== false) done();
  };
  $("mdl").style.display = onDel ? "" : "none";
  $("mdl").onclick = function () { if (confirm("Hapus data ini?")) { onDel(); done(); } };
}

function uniq(a, x) { return a.indexOf(x) < 0 ? a.concat([x]) : a; }

function editTx(id) {
  var t = S.tx.filter(function (x) { return x.id === id; })[0];
  if (!t) return;
  var wl = S.w.map(function (x) { return [x.id, x.n]; });
  var f = [{k: "d", l: "Tanggal", t: "date", v: t.d}, {k: "w", l: t.type === "tf" ? "Dari dompet" : "Dompet", t: "select", v: t.w, o: wl}];
  if (t.type === "tf") f.push({k: "to", l: "Ke dompet", t: "select", v: t.to, o: wl});
  if (t.type === "in" || t.type === "out") f.push({k: "c", l: "Kategori", t: "select", v: t.c, o: uniq(t.type === "in" ? S.ci : S.co, t.c).map(function (c) { return [c, c]; })});
  if (t.type === "inv") f.push({k: "sd", l: "Jenis", t: "select", v: t.side, o: [["b", "Beli"], ["s", "Jual"]]}, {k: "as", l: "Aset", v: t.asset}, {k: "kj", l: "Kategori aset", t: "select", v: t.k, o: uniq(S.kj, t.k).map(function (c) { return [c, c]; })});
  f.push({k: "a", l: t.type === "inv" ? "Total nilai transaksi (Rp)" : "Jumlah (Rp)", t: "number", v: t.a});
  if (t.type === "inv") f.push({k: "px", l: "Harga per unit (Rp)", t: "number", v: t.px}, {k: "fe", l: "Biaya atau fee (Rp)", t: "number", v: t.fee || 0});
  f.push({k: "n", l: "Catatan", v: t.n || ""});
  sheet("Ubah transaksi", f, function (v) {
    var a = +v.a;
    if (!(a > 0)) { alert("Jumlah harus lebih dari 0."); return false; }
    if (t.type === "tf" && v.w === v.to) { alert("Dompet asal dan tujuan tidak boleh sama."); return false; }
    if (t.type === "inv") {
      var px = +v.px, as = v.as.trim();
      if (!as || !(px > 0)) { alert("Isi nama aset dan harga per unit."); return false; }
      t.asset = as; t.k = v.kj; t.side = v.sd; t.px = px; t.u = a / px; t.fee = Math.max(0, +v.fe || 0);
    }
    t.d = v.d || t.d; t.w = v.w; t.a = a; t.n = v.n;
    if (t.type === "tf") t.to = v.to;
    if (t.type === "in" || t.type === "out") t.c = v.c;
  }, function () { S.tx = S.tx.filter(function (x) { return x.id !== id; }); });
}

function editW(id) {
  var x = id ? S.w.filter(function (y) { return y.id === id; })[0] : null, cur = x ? bal()[id] : 0;
  var used = x && S.tx.some(function (t) { return t.w === id || t.to === id; });
  sheet(x ? "Ubah dompet" : "Dompet baru", [{k: "n", l: "Nama dompet", v: x ? x.n : ""}, {k: "s", l: "Saldo sekarang (Rp)", t: "number", v: Math.round(cur)}], function (v) {
    var nm = v.n.trim(), sn = +v.s || 0;
    if (!nm) { alert("Isi nama dompet."); return false; }
    if (x) { x.n = nm; x.i += sn - cur; } else S.w.push({id: "w" + Date.now(), n: nm, i: sn});
  }, x && !used ? function () { S.w = S.w.filter(function (y) { return y.id !== id; }); if (S.lw === id) S.lw = ""; if (S.hw === id) S.hw = ""; } : null);
}

function editC(kind, name) {
  var isNew = name == null, list = S[kind], lock = ["Bensin", "Biaya admin", "Ojol", "Kripto", "Saham"].indexOf(name) >= 0;
  var f = [{k: "n", l: "Nama kategori", v: name || ""}];
  if (kind === "co") f.push({k: "b", l: "Batas bulanan (0 = tanpa batas)", t: "number", v: S.bud[name] || 0});
  sheet(isNew ? "Kategori baru" : "Ubah kategori", f, function (v) {
    var nm = v.n.trim();
    if (!nm) { alert("Isi nama kategori."); return false; }
    if (nm !== name && list.indexOf(nm) >= 0) { alert("Nama itu sudah ada."); return false; }
    if (lock && nm !== name) { alert("Kategori ini dipakai fitur otomatis, namanya tidak bisa diubah."); return false; }
    if (isNew) list.push(nm);
    else if (nm !== name) {
      list[list.indexOf(name)] = nm;
      S.tx.forEach(function (t) { if (kind === "kj") { if (t.type === "inv" && t.k === name) t.k = nm; } else if (t.c === name && t.type === (kind === "co" ? "out" : "in")) t.c = nm; });
      if (S.bud[name] != null) { S.bud[nm] = S.bud[name]; delete S.bud[name]; }
    }
    if (kind === "co") S.bud[nm] = Math.max(0, +v.b || 0);
  }, isNew || lock ? null : function () { S[kind] = list.filter(function (c) { return c !== name; }); });
}

function editA(a) {
  var h = pf()[a], k = h ? h.k : S.kj[0];
  sheet("Ubah aset", [{k: "n", l: "Nama aset", v: a}, {k: "k", l: "Kategori", t: "select", v: k, o: uniq(S.kj, k).map(function (c) { return [c, c]; })}, {k: "p", l: "Harga sekarang per unit (Rp)", t: "number", v: S.px[a] || (h ? h.l : 0)}], function (v) {
    var nm = v.n.trim();
    if (!nm) { alert("Isi nama aset."); return false; }
    S.tx.forEach(function (t) { if (t.type === "inv" && t.asset === a) { t.asset = nm; t.k = v.k; } });
    delete S.px[a];
    if (+v.p > 0) S.px[nm] = +v.p;
  }, null);
}
function editT() {
  sheet("Nama aplikasi", [{k: "n", l: "Judul", v: S.ttl}], function (v) { S.ttl = v.n.trim() || "Tracker Keuangan"; }, null);
}
function editO() {
  var wl = [["", "Belum dipilih"]].concat(S.w.map(function (x) { return [x.id, x.n]; }));
  sheet("Pembagian hasil ojol", [
    {k: "ph", l: "Fase", t: "select", v: S.ph, o: [[1, "Fase 1: sebelum liburan selesai"], [2, "Fase 2: setelah liburan"]]},
    {k: "ot", l: "Target ojol bersih per bulan (0 = tanpa target)", t: "number", v: S.ot || 0},
    {k: "sv", l: "Dana servis motor per hari ngojol (Rp)", t: "number", v: S.sv || 0},
    {k: "lw", l: "Dompet liburan atau pegangan", t: "select", v: S.lw || "", o: wl},
    {k: "jn", l: "Nama jatah bulanan (bukan pengeluaran jajan)", v: S.jn || "Biaya hidup"}, {k: "hw", l: "Dompet biaya hidup bulanan", t: "select", v: S.hw || "", o: wl},
    {k: "a1l", l: "Fase 1: Liburan (%)", t: "number", v: S.a1.lib}, {k: "a1j", l: "Fase 1: Biaya hidup (%)", t: "number", v: S.a1.jajan},
    {k: "a2b", l: "Fase 2: Bitcoin (%)", t: "number", v: S.a2.btc}, {k: "a2s", l: "Fase 2: Saham (%)", t: "number", v: S.a2.saham}, {k: "a2j", l: "Fase 2: Biaya hidup (%)", t: "number", v: S.a2.jajan}
  ], function (v) {
    var g = function (k) { return Math.max(0, +v[k] || 0); };
    if (g("a1l") + g("a1j") > 100 || g("a2b") + g("a2s") + g("a2j") > 100) { alert("Total persen satu fase tidak boleh lebih dari 100%."); return false; }
    S.ph = +v.ph; S.ot = g("ot"); S.sv = g("sv"); S.lw = v.lw; S.hw = v.hw; S.jn = v.jn.trim() || "Biaya hidup";
    S.a1 = {lib: g("a1l"), jajan: g("a1j")}; S.a2 = {btc: g("a2b"), saham: g("a2s"), jajan: g("a2j")};
  });
}

function settings() {
  var chip = function (k, c) { return "<button class=\"chip\" data-c=\"" + esc(c) + "\" onclick=\"editC('" + k + "', this.dataset.c)\">" + esc(c) + "</button>"; };
  var h = "<button class=\"sec\" style=\"margin:0 0 14px\" onclick=\"editO()\">Atur pembagian hasil ojol</button>";
  h += "<label>Kategori pengeluaran (ketuk untuk ubah nama atau batas bulanan)</label><div class=\"chips\">" + S.co.map(function (c) { return chip("co", c); }).join("") + "<button class=\"chip\" onclick=\"editC('co')\">+ Baru</button></div>";
  h += "<label>Kategori pemasukan (ketuk untuk ubah)</label><div class=\"chips\">" + S.ci.map(function (c) { return chip("ci", c); }).join("") + "<button class=\"chip\" onclick=\"editC('ci')\">+ Baru</button></div>";
  h += "<label>Kategori investasi (ketuk untuk ubah)</label><div class=\"chips\">" + S.kj.map(function (c) { return chip("kj", c); }).join("") + "<button class=\"chip\" onclick=\"editC('kj')\">+ Baru</button></div>";
  h += "<label>Tema</label><div class=\"chips\">" + [["auto", "Otomatis"], ["light", "Terang"], ["dark", "Gelap"]].map(function (q) { return "<button class=\"chip" + (S.th === q[0] ? " on" : "") + "\" onclick=\"setTh('" + q[0] + "');settings()\">" + q[1] + "</button>"; }).join("") + "</div>";
  h += "<label>Warna utama</label><div class=\"chips\">" + ["#0f766e", "#2563eb", "#7c3aed", "#db2777", "#ea580c", "#16a34a"].map(function (c) { return "<button class=\"chip\" style=\"background:" + c + ";border-color:" + c + ";color:#fff\" onclick=\"setAc('" + c + "')\" aria-label=\"Warna " + c + "\">&nbsp;&nbsp;&nbsp;</button>"; }).join("") + "<button class=\"chip\" onclick=\"setAc('')\">Bawaan</button></div>";
  h += "<button class=\"sec\" id=\"bk\">Salin cadangan data</button><button class=\"sec\" id=\"rt\">Pulihkan dari cadangan</button><button class=\"sec\" id=\"rs\">Hapus semua data</button>";
  $("set").innerHTML = h;
  $("bk").onclick = function () {
    var s = JSON.stringify(S);
    try { navigator.clipboard.writeText(s).then(function () { alert("Cadangan disalin. Tempel dan simpan di catatan HP."); }, function () { prompt("Salin cadangan ini:", s); }); }
    catch (e) { prompt("Salin cadangan ini:", s); }
  };
  $("rt").onclick = function () {
    var s = prompt("Tempel cadangan di sini:");
    if (!s) return;
    try { S = Object.assign(S, JSON.parse(s)); save(); location.reload(); }
    catch (e) { alert("Cadangan tidak valid."); }
  };
  $("rs").onclick = function () {
    if (!confirm("Semua transaksi dan pengaturan akan dihapus. Lanjutkan?")) return;
    try { localStorage.removeItem(K); localStorage.removeItem(K1); } catch (e) {}
    location.reload();
  };
}

document.querySelectorAll("#tabs button").forEach(function (el) {
  el.onclick = function () {
    tab = el.dataset.t;
    document.querySelectorAll("#tabs button").forEach(function (x) { x.classList.toggle("on", x === el); });
    form();
  };
});
theme(); render(); form(); settings();

if ("serviceWorker" in navigator) window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
